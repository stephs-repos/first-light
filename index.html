<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Light</title>
    <!-- Link preview. The entry is aimed at the Global Mention prize, so it is meant to be
         shared, and a shared link previewed as a bare URL with no title or blurb. The
         description is the hero subtitle verbatim (copy.json `subtitle`) rather than new
         prose, so there is one wording to keep true. No og:image yet — that needs a chosen,
         hosted frame. -->
    <meta name="description" content="Pacific islands answering climate change with sunlight." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="First Light" />
    <meta property="og:title" content="First Light" />
    <meta property="og:description" content="Pacific islands answering climate change with sunlight." />
    <meta property="og:url" content="https://stephs-repos.github.io/first-light/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="First Light" />
    <meta name="twitter:description" content="Pacific islands answering climate change with sunlight." />
    <script type="module" crossorigin src="/first-light/assets/index-BXVhRMPg.js"></script>
    <link rel="stylesheet" crossorigin href="/first-light/assets/index-C8HwrOvg.css">
  </head>
  <body>
    <!-- Fixed map layer sits behind the scrolling narrative. -->
    <div id="map-layer">
      <!-- Named, because it is not decorative: the wall beats put 19 focusable
           country panels inside it, so a keyboard reader tabs into this element. -->
      <svg id="map" role="group" aria-label="Map and charts for the story, which changes as you scroll"></svg>
      <div id="hud">
        <div id="year-label" aria-live="polite"></div>
        <div id="year-note" aria-live="polite"></div>
        <!-- Collapsible legend chip: shown only on narrow viewports (Fix E). -->
        <button id="legend-toggle" class="legend-toggle" type="button" aria-expanded="false" aria-controls="legend">
          Legend
        </button>
        <div id="legend"></div>
      </div>
      <!-- Basemap credit (Fix A condition 4): text from copy.annotations, set by
           map.js; visible only while the satellite backdrop is meaningfully up. -->
      <div id="basemap-credit" aria-hidden="true"></div>
    </div>
    <!-- Hero + narrative column scroll over the fixed map. Text is injected
         from copy.json; the scroll cue is a UI affordance, not narrative. -->
    <header id="hero">
      <div class="hero-inner">
        <h1 id="hero-title"></h1>
        <p id="hero-subtitle"></p>
      </div>
      <div class="hero-cue" aria-hidden="true"><span></span></div>
      <div class="hero-cue-label" aria-hidden="true">scroll</div>
    </header>
    <main id="scroll"></main>
    <!-- Landscape-phone notice (UI affordance, not narrative). Every layout in the
         piece is vertical; on short landscape touchscreens the wall rows collapse and
         the copy cards clip their co-text, so we ask for portrait instead of shipping
         a broken frame. Shown via CSS media query only (coarse pointer + short
         landscape); desktop windows are unaffected. -->
    <div id="rotate-note" role="status">
      <p>This story reads top to bottom.<br />Please turn your phone upright.</p>
    </div>
  </body>
</html>
